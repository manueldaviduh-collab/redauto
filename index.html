<!doctype html>
<html lang="es-VE">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>RedAuto — Repuestos de tiendas verificadas</title>
  <meta name="description" content="RedAuto: marketplace de autopartes de tiendas verificadas en Venezuela. Encuentra el repuesto correcto para tu vehículo y compra con confianza." />
  <meta name="theme-color" content="#0c0c0e" />
  <link rel="manifest" href="manifest.webmanifest" />

  <!-- Favicon (navegador de escritorio / pestaña) -->
  <link rel="icon" type="image/x-icon" href="assets/icons/favicon.ico" />
  <link rel="icon" type="image/png" sizes="32x32" href="assets/icons/favicon-32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="assets/icons/favicon-16.png" />

  <!-- Ícono al agregar a la pantalla de inicio (iOS Safari usa apple-touch-icon,
       no el manifest, para esto) -->
  <link rel="apple-touch-icon" sizes="180x180" href="assets/icons/apple-touch-icon-180.png" />
  <link rel="apple-touch-icon" sizes="167x167" href="assets/icons/apple-touch-icon-167.png" />
  <link rel="apple-touch-icon" sizes="152x152" href="assets/icons/apple-touch-icon-152.png" />
  <link rel="apple-touch-icon" sizes="120x120" href="assets/icons/apple-touch-icon-120.png" />

  <!-- Modo standalone al abrir desde el Home Screen en iOS.
       status-bar-style "black" (no "black-translucent"): con translucent,
       iOS calcula mal window.innerHeight en standalone en algunos modelos
       — el contenido se ve edge-to-edge bajo la barra de estado, pero el
       motor de layout reserva de menos, y esa diferencia (el alto exacto
       de la barra de estado) queda como espacio muerto al fondo, debajo
       de la barra inferior. Con "black" ese espacio queda reservado de
       verdad (barra de estado opaca, mismo color oscuro de la app, visualmente
       casi idéntico) y window.innerHeight ya no queda corto. -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black" />
  <meta name="apple-mobile-web-app-title" content="RedAuto" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="application-name" content="RedAuto" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div id="splash" class="splash" role="presentation">
    <div class="splash__glow" aria-hidden="true"></div>
    <div class="splash__ring-wrap">
      <svg class="splash__ring" viewBox="0 0 120 120" aria-hidden="true">
        <circle class="splash__ring-track" cx="60" cy="60" r="54" />
        <circle class="splash__ring-fill" cx="60" cy="60" r="54" />
      </svg>
      <img class="splash__logo" src="assets/splash-logo.png" alt="RedAuto" />
    </div>
  </div>

  <div id="app" class="app-shell">
    <main id="screen-content" class="screen-content" role="main"></main>
  </div>
  <div id="bottom-nav-root"></div>

  <div id="toast-root" class="toast-root" aria-live="polite"></div>
  <div id="modal-root"></div>

  <script>
    // URL del backend real (ver server/). Cambia esta línea al desplegar
    // — no hace falta tocar ni reconstruir el resto de la app. Ver
    // server/README.md para cómo levantarlo local o en producción.
    window.REDAUTO_API_URL = 'https://redauto-production.up.railway.app/api';
  </script>
  <script type="module" src="js/app.js"></script>
  <script src="js/pwa.js"></script>
</body>
</html>
