<!doctype html>
<html lang="es-VE">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>RedAuto — Repuestos de tiendas verificadas</title>
  <meta name="description" content="RedAuto: marketplace de autopartes de tiendas verificadas en Venezuela. Encuentra el repuesto correcto para tu vehículo y compra con confianza." />
  <meta name="theme-color" content="#0D0D0F" />
  <link rel="icon" type="image/png" href="assets/favicon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div id="splash" class="splash" role="presentation">
    <div class="splash__glow" aria-hidden="true"></div>
    <div class="splash__brand">
      <img class="splash__logo" src="assets/logo-mark.png" alt="" />
      <p class="splash__word">Red<span class="accent">Auto</span></p>
      <p class="splash__tagline">Repuestos · Confianza · Verificados</p>
    </div>
    <div class="splash__progress"><span class="splash__progress-bar"></span></div>
  </div>

  <div id="app" class="app-shell">
    <main id="screen-content" class="screen-content" role="main"></main>
    <div id="bottom-nav-root"></div>
  </div>

  <div id="toast-root" class="toast-root" aria-live="polite"></div>
  <div id="modal-root"></div>

  <script>
    // URL del backend real (ver server/). Cambia esta línea al desplegar
    // — no hace falta tocar ni reconstruir el resto de la app. Ver
    // server/README.md para cómo levantarlo local o en producción.
    window.REDAUTO_API_URL = 'http://localhost:4000/api';
  </script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
